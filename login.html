<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VANTYX FX | Login</title>

    <meta
        name="description"
        content="Sign in or create your VANTYX FX account."
    >

    <!-- =====================================================
         ICONS
    ====================================================== -->

    <script src="https://unpkg.com/lucide@latest"></script>


    <!-- =====================================================
         FONT
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         VANTYX LOGIN PAGE CSS
    ====================================================== -->

    <style>

        /* =====================================================
           DESIGN SYSTEM
        ====================================================== */

        :root {

            --bg: #05070b;
            --bg-soft: #090d14;
            --bg-card: rgba(13,18,28,0.84);
            --bg-card-solid: #0d121c;

            --text: #f5f7fa;
            --text-soft: #a9b2c0;
            --text-muted: #707b8c;

            --gold: #fa7d08;
            --gold-light: #b15907;
            --gold-dark: #38d3fa;

            --cyan: #38d3fa;
            --cyan-dark: #087c9c;

            --success: #39d98a;
            --danger: #ff5c6c;

            --border: rgba(255,255,255,0.08);
            --border-light: rgba(255,255,255,0.13);
            --border-gold: rgba(245, 154, 18, 0.28);
            --border-cyan: rgba(53,214,255,0.24);

            --shadow:
                0 25px 80px rgba(0,0,0,0.48);

            --shadow-gold:
                0 0 55px rgba(214,168,79,0.10);

            --radius: 18px;
            --radius-lg: 28px;

            --container: 1180px;

            --transition: 0.3s ease;
            --transition-fast: 0.18s ease;
        }


        /* =====================================================
           RESET
        ====================================================== */

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
            background: var(--bg);
        }


        body {

            min-height: 100vh;

            color: var(--text);

            background:

                radial-gradient(
                    circle at 15% 15%,
                    rgba(214,168,79,0.06),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 25%,
                    rgba(53,214,255,0.045),
                    transparent 30%
                ),

                var(--bg);

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            line-height: 1.6;

            overflow-x: hidden;

            -webkit-font-smoothing: antialiased;
        }


        body::before {

            content: "";

            position: fixed;

            inset: 0;

            z-index: -1;

            pointer-events: none;

            background-image:

                linear-gradient(
                    rgba(255,255,255,0.014) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.014) 1px,
                    transparent 1px
                );

            background-size: 70px 70px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 85%
                );
        }


        a {
            color: inherit;
            text-decoration: none;
        }


        button,
        input {
            font: inherit;
        }


        button {
            border: 0;
            cursor: pointer;
        }


        img {
            display: block;
            max-width: 100%;
        }


        /* =====================================================
           HEADER
        ====================================================== */

        .site-header {

            position: sticky;

            top: 0;

            z-index: 1000;

            background:
                rgba(5,7,11,0.90);

            border-bottom:
                1px solid var(--border);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);
        }


        .nav-container {

            width:
                min(
                    calc(100% - 40px),
                    1280px
                );

            min-height:
                76px;

            margin-inline:
                auto;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                25px;
        }


        .nav-brand {

            display:
                inline-flex;

            align-items:
                center;

            flex-shrink:
                0;
        }


        .nav-logo-image {

            width:
                auto;

            height:
                43px;

            object-fit:
                contain;
        }


        .desktop-nav {

            display:
                flex;

            align-items:
                center;

            gap:
                3px;

            flex: 1;

            justify-content:
                center;
        }


        .nav-link {

            position:
                relative;

            padding:
                28px 10px;

            color:
                var(--text-soft);

            font-size:
                0.73rem;

            font-weight:
                650;

            white-space:
                nowrap;

            transition:
                color var(--transition);
        }


        .nav-link::after {

            content:
                "";

            position:
                absolute;

            left:
                10px;

            right:
                10px;

            bottom:
                17px;

            height:
                2px;

            border-radius:
                999px;

            background:
                var(--gold);

            transform:
                scaleX(0);

            transition:
                transform var(--transition);
        }


        .nav-link:hover,
        .nav-link.active {

            color:
                var(--text);
        }


        .nav-link:hover::after,
        .nav-link.active::after {

            transform:
                scaleX(1);
        }


        .nav-actions {

            display:
                flex;

            align-items:
                center;

            gap:
                14px;
        }


        .nav-cta {

            min-height:
                42px;

            padding:
                10px 15px;

            display:
                inline-flex;

            align-items:
                center;

            gap:
                7px;

            color:
                #090909;

            background:
                linear-gradient(
                    135deg,
                    var(--gold-light),
                    var(--gold)
                );

            border-radius:
                9px;

            font-size:
                0.72rem;

            font-weight:
                800;
        }


        .nav-cta svg {
            width:
                15px;
        }


        .mobile-menu-toggle {

            display:
                none;

            width:
                42px;

            height:
                42px;

            place-items:
                center;

            color:
                var(--text);

            background:
                rgba(255,255,255,0.03);

            border:
                1px solid var(--border);

            border-radius:
                9px;
        }


        .mobile-menu {

            display:
                none;

            position:
                absolute;

            top:
                100%;

            left:
                0;

            right:
                0;

            padding:
                18px 20px 25px;

            flex-direction:
                column;

            gap:
                2px;

            background:
                rgba(5,7,11,0.98);

            border-bottom:
                1px solid var(--border);

            backdrop-filter:
                blur(20px);
        }


        .mobile-menu.active {
            display:
                flex;
        }


        .mobile-menu > a {

            padding:
                13px 8px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.04);

            color:
                var(--text-soft);

            font-size:
                0.8rem;

            font-weight:
                650;
        }


        .mobile-menu > a:hover {

            color:
                var(--gold-light);
        }


        /* =====================================================
           LOGIN PAGE
        ====================================================== */

        .auth-page {

            min-height:
                calc(100vh - 76px);

            padding:
                85px 20px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            position:
                relative;

            overflow:
                hidden;
        }


        .auth-glow {

            position:
                absolute;

            border-radius:
                50%;

            filter:
                blur(100px);

            pointer-events:
                none;
        }


        .auth-glow-one {

            width:
                360px;

            height:
                360px;

            left:
                8%;

            top:
                12%;

            background:
                rgba(214,168,79,0.065);
        }


        .auth-glow-two {

            width:
                330px;

            height:
                330px;

            right:
                8%;

            bottom:
                8%;

            background:
                rgba(53,214,255,0.045);
        }


        .auth-shell {

            position:
                relative;

            z-index:
                2;

            width:
                min(
                    100%,
                    520px
                );
        }


        /* =====================================================
           BRAND AREA
        ====================================================== */

        .auth-brand {

            text-align:
                center;

            margin-bottom:
                25px;
        }


        .auth-brand img {

            width:
                180px;

            max-height:
                60px;

            margin:
                0 auto;

            object-fit:
                contain;
        }


        .auth-brand p {

            margin-top:
                14px;

            color:
                var(--text-muted);

            font-size:
                0.72rem;

            letter-spacing:
                0.08em;

            text-transform:
                uppercase;
        }


        /* =====================================================
           AUTH CARD
        ====================================================== */

        .auth-card {

            position:
                relative;

            overflow:
                hidden;

            padding:
                34px;

            border:
                1px solid
                var(--border);

            border-radius:
                var(--radius-lg);

            background:

                radial-gradient(
                    circle at 100% 0%,
                    rgba(214,168,79,0.07),
                    transparent 35%
                ),

                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.045),
                    rgba(255,255,255,0.012)
                );

            box-shadow:
                var(--shadow),
                var(--shadow-gold);

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);
        }


        .auth-card::before {

            content:
                "";

            position:
                absolute;

            width:
                180px;

            height:
                180px;

            top:
                -100px;

            left:
                -90px;

            border-radius:
                50%;

            background:
                rgba(53,214,255,0.035);

            filter:
                blur(35px);

            pointer-events:
                none;
        }


        .auth-card > * {

            position:
                relative;

            z-index:
                1;
        }


        /* =====================================================
           TABS
        ====================================================== */

        .auth-tabs {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            padding:
                4px;

            border:
                1px solid
                var(--border);

            border-radius:
                12px;

            background:
                rgba(255,255,255,0.018);
        }


        .auth-tab {

            min-height:
                44px;

            border-radius:
                9px;

            color:
                var(--text-muted);

            background:
                transparent;

            font-size:
                0.72rem;

            font-weight:
                800;

            transition:
                color var(--transition-fast),
                background var(--transition-fast),
                box-shadow var(--transition-fast);
        }


        .auth-tab.active {

            color:
                #090909;

            background:
                linear-gradient(
                    135deg,
                    var(--gold-light),
                    var(--gold)
                );

            box-shadow:
                0 8px 25px
                rgba(214,168,79,0.14);
        }


        /* =====================================================
           FORM HEADER
        ====================================================== */

        .auth-heading {

            margin-top:
                28px;

            text-align:
                center;
        }


        .auth-heading h1 {

            font-size:
                clamp(
                    1.8rem,
                    4vw,
                    2.45rem
                );

            line-height:
                1.05;

            letter-spacing:
                -0.045em;
        }


        .auth-heading p {

            margin-top:
                10px;

            color:
                var(--text-soft);

            font-size:
                0.74rem;

            line-height:
                1.7;
        }


        /* =====================================================
           FORMS
        ====================================================== */

        .auth-form {

            margin-top:
                26px;
        }


        .form-group {

            display:
                flex;

            flex-direction:
                column;

            gap:
                7px;

            margin-top:
                15px;
        }


        .form-group:first-child {
            margin-top:
                0;
        }


        .form-group label {

            color:
                var(--text-muted);

            font-size:
                0.62rem;

            font-weight:
                800;

            letter-spacing:
                0.07em;

            text-transform:
                uppercase;
        }


        .input-wrap {

            position:
                relative;
        }


        .form-input {

            width:
                100%;

            height:
                48px;

            padding:
                0 14px;

            color:
                var(--text);

            background:
                rgba(255,255,255,0.025);

            border:
                1px solid var(--border);

            border-radius:
                10px;

            outline:
                none;

            font-size:
                0.75rem;

            transition:
                background var(--transition-fast),
                border-color var(--transition-fast),
                box-shadow var(--transition-fast);
        }


        .input-wrap .form-input {
            padding-right:
                45px;
        }
