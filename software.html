<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trading Software | VANTYX FX</title>

    <meta
        name="description"
        content="Explore VANTYX FX trading software, PrimeTitan systems, automation tools, options software and forex trading technology."
    >

    <link rel="stylesheet" href="css/style.css">

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>

        /* =====================================================
           SOFTWARE PAGE
        ===================================================== */

        .software-hero {
            position: relative;
            overflow: hidden;
            padding: 120px 0 90px;
            background:
                radial-gradient(
                    circle at 72% 35%,
                    rgba(0, 254, 226, 0.075),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 20% 25%,
                    rgba(254, 165, 0, 0.08),
                    transparent 32%
                );
        }

        .software-hero::before {
            content: "";
            position: absolute;
            width: 550px;
            height: 550px;
            right: -180px;
            top: -120px;
            border-radius: 50%;
            background: rgba(0, 254, 226, 0.035);
            filter: blur(100px);
            pointer-events: none;
        }

        .software-hero-content {
            position: relative;
            z-index: 2;
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }

        .software-hero h1 {
            margin-top: 18px;
            font-size: clamp(3rem, 7vw, 5.8rem);
            line-height: 0.96;
            letter-spacing: -0.06em;
        }

        .software-hero p {
            max-width: 750px;
            margin: 25px auto 0;
            color: var(--text-soft);
            font-size: 1rem;
            line-height: 1.8;
        }

        .software-hero-actions {
            margin-top: 32px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .software-badges {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .software-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(255,255,255,0.018);
            color: var(--text-soft);
            font-size: 0.65rem;
            font-weight: 750;
        }

        .software-badge svg {
            width: 14px;
            color: var(--gold-light);
        }

        .software-hero-visual {
            margin-top: 60px;
        }

        .software-interface {
            position: relative;
            width: min(100%, 1000px);
            min-height: 470px;
            margin-inline: auto;
            overflow: hidden;
            border: 1px solid rgba(0,254,226,0.16);
            border-radius: 24px;
            background:
                radial-gradient(
                    circle at 50% 30%,
                    rgba(0,254,226,0.08),
                    transparent 35%
                ),
                #070b11;
            box-shadow:
                0 30px 100px rgba(0,0,0,0.5),
                0 0 50px rgba(0,254,226,0.05);
        }

        .interface-topbar {
            height: 55px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,0.015);
        }

        .interface-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .interface-brand-mark {
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            color: #000;
            background: linear-gradient(
                135deg,
                var(--gold-light),
                var(--gold)
            );
            font-size: 0.72rem;
            font-weight: 900;
        }

        .interface-brand strong {
            font-size: 0.72rem;
        }

        .interface-live {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--success);
            font-size: 0.6rem;
            font-weight: 800;
        }

        .interface-content {
            padding: 28px;
            display: grid;
            grid-template-columns: 1.45fr 0.55fr;
            gap: 18px;
        }

        .chart-panel {
            min-height: 330px;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: rgba(255,255,255,0.018);
        }

        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chart-header strong {
            font-size: 0.7rem;
        }

        .chart-header span {
            color: var(--cyan);
            font-size: 0.6rem;
            font-weight: 800;
        }

        .chart-area {
            position: relative;
            height: 250px;
            margin-top: 25px;
            overflow: hidden;
            border-radius: 12px;
            background:
                linear-gradient(
                    rgba(255,255,255,0.03) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.03) 1px,
                    transparent 1px
                );
            background-size: 40px 40px;
        }

        .chart-line {
            position: absolute;
            left: 5%;
            right: 5%;
            top: 48%;
            height: 3px;
            background: var(--cyan);
            box-shadow: 0 0 20px rgba(0,254,226,0.55);
            transform:
                rotate(-5deg)
                skewX(-22deg);
            border-radius: 999px;
        }

        .chart-line::before,
        .chart-line::after {
            content: "";
            position: absolute;
            height: 100%;
            border-radius: 999px;
            background: var(--cyan);
        }

        .chart-line::before {
            width: 28%;
            left: 25%;
            top: -28px;
            transform: rotate(-12deg);
        }

        .chart-line::after {
            width: 22%;
            right: 6%;
            top: 30px;
            transform: rotate(17deg);
        }

        .chart-glow {
            position: absolute;
            width: 220px;
            height: 220px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(0,254,226,0.05);
            filter: blur(60px);
        }

        .control-panel {
            display: grid;
            gap: 12px;
        }

        .software-widget {
            min-height: 95px;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(255,255,255,0.018);
        }

        .software-widget span {
            display: block;
            color: var(--text-muted);
            font-size: 0.58rem;
        }

        .software-widget strong {
            display: block;
            margin-top: 7px;
            font-size: 1rem;
        }

        .software-widget .positive {
            color: var(--success);
        }

        .software-widget .cyan {
            color: var(--cyan);
        }

        .software-section-header {
            max-width: 780px;
            margin: 0 auto 55px;
            text-align: center;
        }

        .software-section-header h2 {
            font-size: clamp(2.2rem, 5vw, 4rem);
            line-height: 1;
            letter-spacing: -0.05em;
        }

        .software-section-header p {
            margin-top: 18px;
            color: var(--text-soft);
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .about-software {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 28px;
            align-items: stretch;
        }

        .about-panel {
            padding: 35px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.035),
                    rgba(255,255,255,0.012)
                );
        }

        .about-panel h3 {
            font-size: 1.3rem;
        }

        .about-panel p {
            margin-top: 15px;
            color: var(--text-soft);
            font-size: 0.82rem;
            line-height: 1.8;
        }

        .developer-grid {
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .developer-box {
            padding: 17px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(255,255,255,0.018);
        }

        .developer-box svg {
            width: 19px;
            color: var(--gold-light);
        }

        .developer-box strong {
            display: block;
            margin-top: 9px;
            font-size: 0.72rem;
        }

        .developer-box span {
            display: block;
            margin-top: 4px;
            color: var(--text-muted);
            font-size: 0.62rem;
            line-height: 1.5;
        }

        .software-toggle {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 35px;
        }

        .software-toggle button {
            padding: 11px 18px;
            border: 1px solid var(--border);
            border-radius: 999px;
            color: var(--text-soft);
            background: rgba(255,255,255,0.018);
            font-size: 0.68rem;
            font-weight: 800;
        }

        .software-toggle button.active {
            color: #000;
            border-color: var(--gold);
            background: var(--gold);
        }

        .software-products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .software-product {
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 520px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.035),
                    rgba(255,255,255,0.01)
                );
            transition:
                transform var(--transition),
                border-color var(--transition),
                box-shadow var(--transition);
        }

        .software-product:hover {
            transform: translateY(-7px);
            border-color: var(--border-gold);
            box-shadow:
                0 25px 70px rgba(0,0,0,0.35),
                0 0 35px rgba(254,165,0,0.05);
        }

        .software-product.featured {
            border-color: rgba(0,254,226,0.22);
        }

        .product-image {
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
            background: #070b11;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 9px;
        }

        .product-image-placeholder {
            width: 85%;
            height: 75%;
            display: grid;
            place-items: center;
            border: 1px dashed rgba(0,254,226,0.18);
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 0.6rem;
            text-align: center;
        }

        .product-content {
            flex: 1;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .product-tag {
            display: inline-flex;
            align-self: flex-start;
            padding: 5px 8px;
            border: 1px solid var(--border-orange);
            border-radius: 999px;
            color: var(--gold-light);
            background: rgba(254,165,0,0.06);
            font-size: 0.55rem;
            font-weight: 850;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .product-content h3 {
            margin-top: 15px;
            font-size: 1.2rem;
        }

        .product-description {
            margin-top: 10px;
            color: var(--text-soft);
            font-size: 0.72rem;
            line-height: 1.7;
        }

        .product-features {
            margin-top: 18px;
            display: grid;
            gap: 9px;
        }

        .product-features li {
            display: flex;
            gap: 8px;
            color: var(--text-soft);
            font-size: 0.65rem;
        }

        .product-features svg {
            width: 14px;
            color: var(--success);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .product-price {
            margin-top: auto;
            padding-top: 20px;
        }

        .product-price strong {
            color: var(--text);
            font-size: 1.3rem;
        }

        .product-price del {
            margin-left: 8px;
            color: var(--text-muted);
            font-size: 0.7rem;
        }

        .product-content .btn {
            width: 100%;
            margin-top: 18px;
        }

        .flagship {
            margin-top: 20px;
            padding: 40px;
            border: 1px solid rgba(0,254,226,0.22);
            border-radius: 22px;
            background:
                radial-gradient(
                    circle at 90% 20%,
                    rgba(0,254,226,0.08),
                    transparent 33%
                ),
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.035),
                    rgba(255,255,255,0.01)
                );
        }

        .flagship-layout {
            display: grid;
            grid-template-columns: 0.8fr 1.2fr;
            gap: 40px;
            align-items: center;
        }

        .flagship-icon {
            width: 75px;
            height: 75px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(0,254,226,0.25);
            border-radius: 20px;
            color: var(--cyan);
            background: rgba(0,254,226,0.05);
            box-shadow: var(--glow-cyan);
        }

        .flagship-icon svg {
            width: 34px;
            height: 34px;
        }

        .flagship-content h2 {
            margin-top: 18px;
            font-size: clamp(1.9rem, 4vw, 3.2rem);
            line-height: 1;
            letter-spacing: -0.045em;
        }

        .flagship-content p {
            margin-top: 15px;
            color: var(--text-soft);
            font-size: 0.82rem;
            line-height: 1.8;
        }

        .flagship-features {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .flagship-feature {
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(255,255,255,0.018);
        }

        .flagship-feature svg {
            width: 17px;
            color: var(--cyan);
        }

        .flagship-feature strong {
            display: block;
            margin-top: 8px;
            font-size: 0.65rem;
        }

        .flagship-price {
            margin-top: 22px;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .flagship-price strong {
            font-size: 1.6rem;
            color: var(--gold-light);
        }

        .flagship-price del {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        .comparison-card {
            padding: 32px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: rgba(255,255,255,0.018);
        }

        .comparison-card h3 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.15rem;
        }

        .comparison-card h3 svg {
            width: 23px;
            color: var(--gold-light);
        }

        .comparison-card ul {
            margin-top: 22px;
            display: grid;
            gap: 12px;
        }

        .comparison-card li {
            display: flex;
            gap: 9px;
            color: var(--text-soft);
            font-size: 0.75rem;
        }

        .comparison-card li svg {
            width: 15px;
            color: var(--success);
            flex-shrink: 0;
        }

        .why-software {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .why-card {
            padding: 28px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: rgba(255,255,255,0.018);
        }

        .why-card svg {
            width: 25px;
            color: var(--gold-light);
        }

        .why-card h3 {
            margin-top: 17px;
            font-size: 0.95rem;
        }

        .why-card p {
            margin-top: 9px;
            color: var(--text-soft);
            font-size: 0.72rem;
            line-height: 1.75;
        }

        .software-disclaimer {
            margin-top: 35px;
            padding: 17px 20px;
            border-left: 2px solid var(--danger);
            background: rgba(255,92,108,0.035);
            color: var(--text-muted);
            font-size: 0.65rem;
            line-height: 1.7;
        }

        .faq-list {
            max-width: 850px;
            margin: 0 auto;
            display: grid;
            gap: 10px;
        }

        .faq-item {
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(255,255,255,0.018);
            overflow: hidden;
        }

        .faq-question {
            width: 100%;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            color: var(--text);
            background: transparent;
            text-align: left;
            font-size: 0.78rem;
            font-weight: 750;
        }

        .faq-question svg {
            width: 17px;
            color: var(--gold-light);
            flex-shrink: 0;
        }

        .faq-answer {
            padding: 0 20px 20px;
            color: var(--text-soft);
            font-size: 0.73rem;
            line-height: 1.75;
        }

        @media (max-width: 1050px) {

            .software-products {
                grid-template-columns: repeat(2, 1fr);
            }

            .about-software {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 850px) {

            .interface-content {
                grid-template-columns: 1fr;
            }

            .flagship-layout {
                grid-template-columns: 1fr;
            }

            .why-software {
                grid-template-columns: 1fr;
            }

            .comparison-grid {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 600px) {

            .software-hero {
                padding: 80px 0 60px;
            }

            .software-hero h1 {
                font-size: clamp(2.5rem, 13vw, 4rem);
            }

            .software-hero-actions {
                flex-direction: column;
            }

            .software-hero-actions .btn {
                width: 100%;
            }

            .software-interface {
                min-height: 390px;
            }

            .interface-content {
                padding: 15px;
            }

            .chart-panel {
                min-height: 270px;
            }

            .chart-area {
                height: 195px;
            }

            .software-products {
                grid-template-columns: 1fr;
            }

            .developer-grid {
                grid-template-columns: 1fr;
            }

            .flagship {
                padding: 25px;
            }

            .flagship-features {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>
