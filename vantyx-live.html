<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VANTYX.live — Trading Terminal</title>

    <meta
        name="description"
        content="VANTYX.live — a professional trading workspace with live markets, charting, analysis, risk management and Deriv integration."
    >

    <!-- =====================================================
         ICONS
    ====================================================== -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- =====================================================
         FONT
    ====================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =====================================================
           VANTYX LIVE — DESIGN SYSTEM
        ====================================================== */

        :root {
            --bg: #05070b;
            --panel: #090d14;
            --panel-2: #0d121c;
            --panel-3: #111824;

            --gold: #d6a84f;
            --gold-light: #f2d38a;
            --gold-dark: #9d7428;

            --cyan: #35d6ff;
            --cyan-dark: #087c9c;

            --success: #39d98a;
            --danger: #ff5c6c;
            --warning: #ffbd59;

            --text: #f5f7fa;
            --text-soft: #a9b2c0;
            --text-muted: #6f7a8c;

            --border: rgba(255,255,255,0.075);
            --border-light: rgba(255,255,255,0.11);
            --border-gold: rgba(214,168,79,0.28);
            --border-cyan: rgba(53,214,255,0.23);

            --shadow: 0 20px 60px rgba(0,0,0,0.40);

            --sidebar: 245px;
            --topbar: 68px;

            --radius: 14px;
            --radius-lg: 20px;

            --transition: 0.25s ease;
        }


        /* =====================================================
           RESET
        ====================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background:
                radial-gradient(
                    circle at 75% 15%,
                    rgba(214,168,79,0.055),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 25% 70%,
                    rgba(53,214,255,0.03),
                    transparent 25%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        svg {
            flex-shrink: 0;
        }


        /* =====================================================
           APPLICATION SHELL
        ====================================================== */

        .app {
            min-height: 100vh;
            display: flex;
        }


        /* =====================================================
           SIDEBAR
        ====================================================== */

        .sidebar {
            position: fixed;
            inset: 0 auto 0 0;

            width: var(--sidebar);

            display: flex;
            flex-direction: column;

            background:
                linear-gradient(
                    180deg,
                    #080b11 0%,
                    #06080d 100%
                );

            border-right: 1px solid var(--border);

            z-index: 100;
        }


        /* =====================================================
           SIDEBAR BRAND
        ====================================================== */

        .sidebar-brand {
            height: var(--topbar);

            padding: 0 20px;

            display: flex;
            align-items: center;

            border-bottom: 1px solid var(--border);
        }

        .brand-logo {
            display: flex;
            align-items: center;

            gap: 10px;
        }

        .brand-logo img {
            width: 38px;
            height: 38px;

            object-fit: contain;
        }

        .brand-name {
            display: flex;
            flex-direction: column;

            line-height: 1;
        }

        .brand-name strong {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 0.10em;
        }

        .brand-name span {
            margin-top: 4px;

            color: var(--gold);

            font-size: 8px;
            font-weight: 800;

            letter-spacing: 0.25em;
        }


        /* =====================================================
           SIDEBAR NAVIGATION
        ====================================================== */

        .sidebar-nav {
            flex: 1;

            padding: 16px 12px;

            overflow-y: auto;
        }

        .nav-section-title {
            padding: 12px 12px 7px;

            color: var(--text-muted);

            font-size: 9px;
            font-weight: 800;

            letter-spacing: 0.13em;

            text-transform: uppercase;
        }

        .sidebar-link {
            width: 100%;

            min-height: 43px;

            margin-bottom: 3px;

            padding: 0 12px;

            display: flex;
            align-items: center;

            gap: 11px;

            border: 1px solid transparent;
            border-radius: 9px;

            color: var(--text-soft);

            background: transparent;

            font-size: 11px;
            font-weight: 600;

            transition:
                color var(--transition),
                background var(--transition),
                border-color var(--transition);
        }

        .sidebar-link svg {
            width: 17px;
            height: 17px;

            color: var(--text-muted);
        }

        .sidebar-link:hover {
            color: var(--text);
            background: rgba(255,255,255,0.035);
        }

        .sidebar-link:hover svg {
            color: var(--gold-light);
        }

        .sidebar-link.active {
            color: var(--gold-light);

            background:
                linear-gradient(
                    90deg,
                    rgba(214,168,79,0.12),
                    rgba(214,168,79,0.035)
                );

            border-color:
                rgba(214,168,79,0.16);
        }

        .sidebar-link.active svg {
            color: var(--gold-light);
        }


        /* =====================================================
           BADGE
        ====================================================== */

        .notification-badge {
            margin-left: auto;

            min-width: 19px;
            height: 19px;

            padding: 0 5px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border-radius: 999px;

            color: #090909;

            background: var(--gold-light);

            font-size: 8px;
            font-weight: 900;
        }


        /* =====================================================
           SIDEBAR FOOTER
        ====================================================== */

        .sidebar-footer {
            padding: 14px;

            border-top: 1px solid var(--border);
        }

        .connection-status {
            padding: 12px;

            border: 1px solid var(--border);

            border-radius: 10px;

            background: rgba(255,255,255,0.02);
        }

        .connection-top {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .connection-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--success);

            box-shadow:
                0 0 12px rgba(57,217,138,0.75);
        }

        .connection-top strong {
            font-size: 10px;
        }

        .connection-status small {
            display: block;

            margin-top: 5px;

            color: var(--text-muted);

            font-size: 8px;
        }


        /* =====================================================
           MAIN AREA
        ====================================================== */

        .main {
            width: calc(100% - var(--sidebar));

            margin-left: var(--sidebar);

            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }


        /* =====================================================
           TOPBAR
        ====================================================== */

        .topbar {
            position: fixed;
            top: 0;
            right: 0;

            left: var(--sidebar);

            height: var(--topbar);

            display: flex;
            align-items: center;

            padding: 0 18px;

            border-bottom: 1px solid var(--border);

            background:
                rgba(5,7,11,0.92);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            z-index: 90;
        }


        /* =====================================================
           TOPBAR LEFT
        ====================================================== */

        .topbar-left {
            display: flex;
            align-items: center;

            gap: 12px;

            min-width: 0;
        }

        .mobile-sidebar-toggle {
            display: none;

            width: 38px;
            height: 38px;

            align-items: center;
            justify-content: center;

            border: 1px solid var(--border);
            border-radius: 9px;

            color: var(--text);

            background: rgba(255,255,255,0.035);
        }

        .workspace-title {
            display: flex;
            flex-direction: column;
        }

        .workspace-title span {
            color: var(--text-muted);

            font-size: 8px;

            text-transform: uppercase;
            letter-spacing: 0.10em;
        }

        .workspace-title strong {
            margin-top: 2px;

            font-size: 12px;
        }


        /* =====================================================
           SEARCH
        ====================================================== */

        .market-search {
            width: 270px;

            margin-left: 20px;

            position: relative;
        }

        .market-search input {
            width: 100%;
            height: 36px;

            padding: 0 12px 0 34px;

            outline: none;

            border: 1px solid var(--border);

            border-radius: 8px;

            color: var(--text);

            background: rgba(255,255,255,0.025);

            font-size: 10px;
        }

        .market-search svg {
            position: absolute;

            top: 50%;
            left: 11px;

            transform: translateY(-50%);

            width: 15px;

            color: var(--text-muted);
        }


        /* =====================================================
           TOPBAR RIGHT
        ====================================================== */

        .topbar-right {
            margin-left: auto;

            display: flex;
            align-items: center;

            gap: 9px;
        }

        .mode-switch {
            height: 34px;

            display: flex;
            align-items: center;

            padding: 3px;

            border: 1px solid var(--border);

            border-radius: 8px;

            background: rgba(255,255,255,0.025);
        }

        .mode-button {
            height: 28px;

            padding: 0 10px;

            border: 0;
            border-radius: 6px;

            color: var(--text-muted);

            background: transparent;

            font-size: 9px;
            font-weight: 800;
        }

        .mode-button.active {
            color: var(--gold-light);

            background: rgba(214,168,79,0.10);
        }

        .balance {
            min-height: 36px;

            padding: 6px 11px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            border: 1px solid var(--border);

            border-radius: 8px;

            background: rgba(255,255,255,0.02);
        }

        .balance span {
            color: var(--text-muted);
            font-size: 7px;
        }

        .balance strong {
            margin-top: 1px;

            font-size: 11px;
        }

        .account-button {
            height: 36px;

            padding: 0 10px;

            display: flex;
            align-items: center;

            gap: 7px;

            border: 1px solid var(--border);

            border-radius: 8px;

            color: var(--text-soft);

            background: rgba(255,255,255,0.025);

            font-size: 9px;
            font-weight: 700;
        }


        /* =====================================================
           WORKSPACE
        ====================================================== */

        .workspace {
            margin-top: var(--topbar);

            height: calc(100vh - var(--topbar));

            padding: 14px;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                315px;

            grid-template-rows:
                auto
                minmax(0, 1fr)
                190px;

            gap: 12px;

            overflow: hidden;
        }


        /* =====================================================
           MARKET STRIP
        ====================================================== */

        .market-strip {
            grid-column: 1 / -1;

            display: flex;
            align-items: center;

            gap: 8px;

            overflow-x: auto;

            scrollbar-width: none;
        }

        .market-strip::-webkit-scrollbar {
            display: none;
        }

        .market-chip {
            min-width: 145px;

            padding: 9px 11px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border: 1px solid var(--border);

            border-radius: 9px;

            background:
                rgba(255,255,255,0.02);
        }

        .market-chip.active {
            border-color: var(--border-gold);

            background:
                rgba(214,168,79,0.055);
        }

        .market-chip-name {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .market-chip-name strong {
            font-size: 10px;
        }

        .market-chip-name span {
            color: var(--text-muted);
            font-size: 7px;
        }

        .market-price {
            text-align: right;
        }

        .market-price strong {
            display: block;
            font-size: 10px;
        }

        .market-price span {
            font-size: 7px;
            font-weight: 800;
        }


        /* =====================================================
           CHART PANEL
        ====================================================== */

        .chart-panel {
            min-width: 0;
            min-height: 0;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            border: 1px solid var(--border);

            border-radius: var(--radius-lg);

            background:
                linear-gradient(
                    145deg,
                    rgba(13,18,28,0.96),
                    rgba(7,10,15,0.96)
                );
        }


        /* =====================================================
           CHART HEADER
        ====================================================== */

        .chart-header {
            min-height: 57px;

            padding: 0 14px;

            display: flex;
            align-items: center;

            border-bottom: 1px solid var(--border);
        }

        .chart-instrument {
            display: flex;
            align-items: center;

            gap: 10px;
        }

        .instrument-icon {
            width: 34px;
            height: 34px;

            display: grid;
            place-items: center;

            border: 1px solid var(--border-gold);

            border-radius: 8px;

            color: var(--gold-light);

            background:
                rgba(214,168,79,0.06);
        }

        .instrument-icon svg {
            width: 17px;
        }

        .instrument-name {
            display: flex;
            flex-direction: column;
        }

        .instrument-name strong {
            font-size: 12px;
        }

        .instrument-name span {
            margin-top: 2px;

            color: var(--text-muted);

            font-size: 7px;
        }

        .chart-live {
            display: inline-flex;
            align-items: center;

            gap: 6px;

            margin-left: 10px;

            color: var(--success);

            font-size: 7px;
            font-weight: 800;
        }

        .tiny-dot {
            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: var(--success);

            box-shadow:
                0 0 8px rgba(57,217,138,0.8);
        }

        .chart-controls {
            margin-left: auto;

            display: flex;
            align-items: center;

            gap: 5px;
        }

        .chart-control {
            width: 30px;
            height: 30px;

            display: grid;
            place-items: center;

            border: 1px solid transparent;
            border-radius: 7px;

            color: var(--text-muted);

            background: transparent;
        }

        .chart-control:hover,
        .chart-control.active {
            color: var(--gold-light);

            background:
                rgba(214,168,79,0.055);

            border-color:
                var(--border-gold);
        }

        .chart-control svg {
            width: 14px;
        }


        /* =====================================================
           CHART TOOLBAR
        ====================================================== */

        .chart-toolbar {
            height: 39px;

            padding: 0 12px;

            display: flex;
            align-items: center;

            gap: 5px;

            border-bottom: 1px solid var(--border);

            overflow-x: auto;

            scrollbar-width: none;
        }

        .chart-toolbar::-webkit-scrollbar {
            display: none;
        }

        .timeframe {
            min-width: 35px;
            height: 26px;

            padding: 0 7px;

            border: 1px solid transparent;
            border-radius: 6px;

            color: var(--text-muted);

            background: transparent;

            font-size: 8px;
            font-weight: 700;
        }

        .timeframe:hover,
        .timeframe.active {
            color: var(--gold-light);

            border-color:
                var(--border-gold);

            background:
                rgba(214,168,79,0.055);
        }

        .toolbar-divider {
            width: 1px;
            height: 18px;

            margin: 0 4px;

            background: var(--border);
        }


        /* =====================================================
           CHART BODY
        ====================================================== */

        .chart-body {
            position: relative;

            flex: 1;

            min-height: 0;

            overflow: hidden;

            background:
                linear-gradient(
                    rgba(255,255,255,0.015) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.015) 1px,
                    transparent 1px
                );

            background-size: 60px 42px;
        }

        .chart-empty {
            position: absolute;

            inset: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;
